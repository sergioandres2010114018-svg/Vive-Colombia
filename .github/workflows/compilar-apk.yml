name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Crear la carpeta de Android
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name vive_colombia --org co.vivecolombia
            rm -rf test
          fi
          MAN=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="ViveColombia"/' $MAN
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle* || true
          grep -q 'android.permission.INTERNET' $MAN || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $MAN

      - name: Instalar paquetes
        run: flutter pub get

      - name: Icono de la app
        run: dart run flutter_launcher_icons

      - name: Compilar
        run: |
          set -o pipefail
          if ! flutter build apk --release 2>&1 | tee build.log; then
            MSG=$(grep -iE "error|what went wrong" -A4 build.log | head -n 30 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Error de compilacion::$MSG"
            exit 1
          fi

      - name: Entregar el APK
        uses: actions/upload-artifact@v4
        with:
          name: ViveColombia-APK
          path: build/app/outputs/flutter-apk/app-release.apk
