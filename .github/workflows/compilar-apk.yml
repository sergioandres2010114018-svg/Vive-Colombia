yaml
name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Crear la carpeta de Android
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name vive_colombia --org co.vivecolombia
            rm -rf test
          fi
          MAN=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="ViveColombia"/' $MAN
          grep -q 'android.permission.INTERNET' $MAN || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $MAN

      - name: Instalar paquetes
        run: flutter pub get

      - name: Icono de la app
        run: dart run flutter_launcher_icons

      - name: Compilar
        run: flutter build apk --release

      - name: Entregar el APK
        uses: actions/upload-artifact@v4
        with:
          name: ViveColombia-APK
          path: build/app/outputs/flutter-apk/app-release.apk
